<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2nd Fix Quote Wizard v3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B3A5C;
      --orange: #F4821F;
      --success: #27AE60;
      --danger: #E74C3C;
      --bg: #F5F6FA;
      --white: #ffffff;
      --border: #dde3ef;
      --text: #1a2332;
      --text-light: #6b7a99;
      --radius: 12px;
      --shadow: 0 2px 14px rgba(27,58,92,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; line-height: 1.5; }
    #app { max-width: 600px; margin: 0 auto; padding-bottom: 40px; }

    /* Header */
    .app-header { background: var(--navy); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    .app-header h1 { font-size: 17px; font-weight: 700; flex: 1; }
    .header-badge { background: var(--orange); color: white; border-radius: 6px; padding: 2px 9px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .btn-back { background: transparent; color: rgba(255,255,255,0.85); border: none; padding: 6px 0; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: inherit; font-weight: 500; min-width: 44px; min-height: 44px; flex-shrink: 0; }
    .btn-back:active { color: white; }


    /* Login */
    #app.login-active { max-width: none; min-height: 100vh; padding-bottom: 0; }
    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 14px; }
    .login-card { width: 100%; max-width: 420px; background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: 0 8px 28px rgba(27,58,92,0.18); border: 1px solid var(--border); }
    .login-brand { background: var(--navy); color: white; padding: 28px 24px 24px; text-align: center; }
    .login-brand-mark { font-size: 34px; line-height: 1; margin-bottom: 10px; }
    .login-brand h1 { font-size: 23px; font-weight: 800; line-height: 1.25; }
    .login-brand p { font-size: 13px; color: rgba(255,255,255,0.72); margin-top: 6px; }
    .login-form { padding: 24px; }
    .login-error { background: #fdecea; border: 1px solid var(--danger); color: var(--danger); border-radius: 9px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
    .header-user { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .header-user-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.84); white-space: nowrap; }
    .btn-logout { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.55); border-radius: 6px; padding: 5px 8px; font-size: 11px; font-family: inherit; font-weight: 700; cursor: pointer; min-height: 30px; }
    .btn-logout:active { background: rgba(255,255,255,0.14); }
    @media (max-width: 420px) { .header-user-name { display: none; } .app-header { gap: 7px; } }

    /* Screen */
    .screen { padding: 14px 14px 0; }
    .screen-enter { animation: slideIn 0.18s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }

    /* Card */
    .card { background: var(--white); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card h2 { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
    .card h3 { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
    .form-group .hint { font-size: 12px; color: var(--text-light); margin-top: 5px; }
    .form-group .err { font-size: 12px; color: var(--danger); margin-top: 5px; font-weight: 500; }
    input[type=text], input[type=email], input[type=password], input[type=number], textarea, select { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 9px; font-size: 16px; font-family: inherit; color: var(--text); background: white; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; }
    input[type=text]:focus, input[type=email]:focus, input[type=password]:focus, input[type=number]:focus, textarea:focus { outline: none; border-color: var(--navy); }
    textarea { min-height: 80px; resize: vertical; }
    .input-unit-wrap { position: relative; display: flex; align-items: center; }
    .input-unit-wrap input { padding-right: 48px; }
    .input-unit-wrap .unit { position: absolute; right: 13px; font-size: 13px; color: var(--text-light); font-weight: 500; pointer-events: none; }

    /* Door Type Grid */
    .door-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .door-btn { background: white; border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.15s; min-height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
    .door-btn:active { transform: scale(0.96); background: #eef3f8; }
    .door-btn .icon { font-size: 26px; line-height: 1; }
    .door-btn .lbl { font-size: 12px; font-weight: 600; color: var(--navy); line-height: 1.3; }

    /* Options */
    .opts { display: grid; gap: 8px; }
    .opts.cols2 { grid-template-columns: repeat(2, 1fr); }
    .opt-btn { background: white; border: 2px solid var(--border); border-radius: 10px; padding: 13px 14px; text-align: left; cursor: pointer; transition: all 0.15s; font-size: 15px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 10px; min-height: 50px; -webkit-tap-highlight-color: transparent; width: 100%; font-family: inherit; }
    .opt-radio { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .opt-btn.sel { border-color: var(--navy); background: #eef3f8; }
    .opt-btn.sel .opt-radio { border-color: var(--navy); background: var(--navy); }
    .opt-btn.sel .opt-radio::after { content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; display: block; }

    /* Yes/No */
    .yn { display: grid; gap: 9px; }
    .yn.c2 { grid-template-columns: repeat(2, 1fr); }
    .yn.c3 { grid-template-columns: repeat(3, 1fr); }
    .yn-btn { padding: 14px 10px; border-radius: 10px; border: 2px solid var(--border); font-size: 15px; font-weight: 600; cursor: pointer; background: white; transition: all 0.15s; min-height: 50px; font-family: inherit; -webkit-tap-highlight-color: transparent; }
    .yn-btn.y.sel { background: #d4edda; border-color: var(--success); color: #155724; }
    .yn-btn.n.sel { background: #fdecea; border-color: var(--danger); color: var(--danger); }
    .yn-btn.t.sel { background: #fff3cd; border-color: #d4a017; color: #856404; }

    /* Banners */
    .banner { padding: 11px 14px; border-radius: 9px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
    .banner:last-child { margin-bottom: 0; }
    .b-warn { background: #fff3cd; border: 1px solid #d4a017; color: #856404; }
    .b-danger { background: #fdecea; border: 1px solid var(--danger); color: var(--danger); font-weight: 600; }
    .b-success { background: #d4edda; border: 1px solid var(--success); color: #155724; }
    .b-info { background: #e8f0fe; border: 1px solid #3a7bd5; color: #1a3a7c; }

    /* Progress */
    .progress-wrap { margin-bottom: 14px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); margin-bottom: 6px; font-weight: 500; }
    .progress-track { background: var(--border); border-radius: 4px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--orange); border-radius: 4px; transition: width 0.3s; }

    /* Step header */
    .step-hdr { margin-bottom: 16px; }
    .step-title { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 3px; line-height: 1.3; }
    .step-sub { font-size: 14px; color: var(--text-light); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; min-height: 50px; -webkit-tap-highlight-color: transparent; font-family: inherit; text-decoration: none; width: 100%; }
    .btn-primary { background: var(--navy); color: white; }
    .btn-primary:active { background: #122847; }
    .btn-orange { background: var(--orange); color: white; }
    .btn-orange:active { background: #d4700f; }
    .btn-success { background: var(--success); color: white; }
    .btn-outline { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
    .btn-outline-red { background: transparent; color: var(--danger); border: 2px solid var(--danger); }
    .btn-sm { padding: 10px 16px; font-size: 14px; min-height: 42px; }
    .btn-auto { width: auto; }
    .btn-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    /* Inline calc */
    .calc-box { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 12px; margin-top: 10px; }
    .calc-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14px; }
    .calc-row:not(:last-child) { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 4px; }
    .cv { font-weight: 700; }
    .cs { color: var(--success); }
    .cd { color: var(--danger); }
    .co { color: var(--orange); }

    /* Sizing card */
    .size-card { background: var(--navy); color: white; border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .size-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .size-row:last-child { border-bottom: none; }
    .sl { color: rgba(255,255,255,0.65); }
    .sv { font-weight: 700; }

    /* Checklist */
    .checklist { list-style: none; }
    .checklist li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .checklist li:last-child { border-bottom: none; }
    input[type=checkbox] { width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; accent-color: var(--navy); }

    /* Summary output */
    .out-box { background: #1a2332; color: #e4e9f5; border-radius: 10px; padding: 14px; font-family: 'Courier New', monospace; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-height: 380px; overflow-y: auto; }

    /* Job summary header */
    .job-hdr-card { background: var(--navy); color: white; border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
    .job-hdr-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .job-hdr-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .job-hdr-row:last-child { border-bottom: none; }
    .jl { color: rgba(255,255,255,0.65); }
    .jv { font-weight: 600; }

    /* Utilities */
    .mt8 { margin-top: 8px; }
    .mt12 { margin-top: 12px; }
    .mt14 { margin-top: 14px; }
    .mb8 { margin-bottom: 8px; }
    .mb12 { margin-bottom: 12px; }
    .mb14 { margin-bottom: 14px; }
    .fw6 { font-weight: 600; }
    .fw7 { font-weight: 700; }
    .tc { text-align: center; }
    .sm { font-size: 13px; }
    .muted { color: var(--text-light); }
    .c-navy { color: var(--navy); }
    .copy-feedback { text-align: center; font-size: 13px; color: var(--success); min-height: 22px; margin-top: 8px; font-weight: 600; }

    /* Door tab strip */
    .door-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; scrollbar-width: none; }
    .door-tabs::-webkit-scrollbar { display: none; }
    .door-tab { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; background: white; border: 2px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-light); font-family: inherit; }
    .door-tab.active { background: var(--navy); border-color: var(--navy); color: white; }

    /* Photo slots */
    .photo-slot { margin-bottom: 14px; }
    .photo-slot-label { font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
    .btn-photo { display: inline-flex; align-items: center; gap: 7px; padding: 11px 18px; background: var(--orange); color: white; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 46px; -webkit-tap-highlight-color: transparent; border: none; width: 100%; justify-content: center; }
    .photo-thumb { width: 100%; max-height: 140px; object-fit: cover; border-radius: 9px; margin-top: 9px; border: 2px solid var(--border); display: block; }

    /* Size picker removed - now uses plain inputs */
    .warranty-box { background: #fff3cd; border: 2px solid #e6a817; border-radius: 10px; padding: 16px; margin-top: 12px; }
    .warranty-box h4 { color: #b35a00; margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .warranty-box p { color: #7a4000; font-size: 13px; margin: 0 0 12px; line-height: 1.5; }
    .warranty-check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; cursor: pointer; }
    .warranty-check input[type=checkbox] { width: 22px; height: 22px; min-width: 22px; margin-top: 2px; accent-color: #e6a817; cursor: pointer; }
    .warranty-check span { font-size: 14px; color: #333; line-height: 1.4; font-weight: 500; }
    .warranty-sig { margin-top: 8px; }
    .warranty-sig label { font-size: 13px; color: #7a4000; font-weight: 600; display: block; margin-bottom: 6px; }
    .warranty-sig input { width: 100%; padding: 10px 12px; border: 2px solid #e6a817; border-radius: 8px; font-size: 15px; font-family: inherit; box-sizing: border-box; background: white; }

    /* Improvements button + modal */
    #improveBtn { position: fixed; bottom: 20px; right: 16px; background: var(--orange); color: white; border: none; border-radius: 24px; padding: 12px 18px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.28); z-index: 998; font-family: inherit; letter-spacing: 0.01em; }
    #improveBtn:active { background: #d4700f; transform: scale(0.97); }
    #improveOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
    #improveModal { background: white; border-radius: var(--radius); padding: 22px; width: 100%; max-width: 500px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    #improveModal h3 { color: var(--navy); margin-bottom: 8px; font-size: 17px; }
    #improveModal .sub { font-size: 13px; color: var(--text-light); margin-bottom: 14px; line-height: 1.5; }
    #improveFeedback { width: 100%; min-height: 110px; padding: 12px 14px; border: 2px solid var(--border); border-radius: 9px; font-size: 15px; font-family: inherit; resize: vertical; box-sizing: border-box; }
    #improveFeedback:focus { outline: none; border-color: var(--navy); }
    #app { padding-bottom: 80px; }
    .hw-section { background: #f9fafc; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; }
    .hw-section h3 { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
    .hw-extra-row { border: 1px solid var(--border); border-radius: 9px; padding: 12px; margin-bottom: 8px; background: white; }
    .hw-extra-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }



    /* Help guide */
    .btn-help { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.55); border-radius: 7px; min-width: 40px; min-height: 34px; padding: 5px 8px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .btn-help:active { background: rgba(255,255,255,0.14); }
    .help-intro { font-size: 14px; color: var(--text-light); margin-bottom: 14px; }
    .help-accordion { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
    .help-accordion-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 15px 16px; background: white; color: var(--navy); border: 0; text-align: left; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
    .help-accordion-btn .help-arrow { margin-left: auto; color: var(--orange); font-size: 18px; transition: transform 0.18s; }
    .help-accordion.open .help-arrow { transform: rotate(90deg); }
    .help-accordion-panel { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
    .help-accordion.open .help-accordion-panel { display: block; }
    .help-accordion-panel h3 { color: var(--navy); font-size: 14px; margin: 14px 0 7px; }
    .help-accordion-panel p, .help-accordion-panel li { font-size: 13px; line-height: 1.55; }
    .help-accordion-panel ul, .help-accordion-panel ol { padding-left: 20px; }
    .help-accordion-panel li { margin: 5px 0; }
    .help-quick-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .help-quick-table th { background: #eef3f8; color: var(--navy); text-align: left; font-size: 11px; }
    .help-quick-table th, .help-quick-table td { padding: 8px 6px; vertical-align: top; border-bottom: 1px solid var(--border); }
    .help-quick-table tr:last-child td { border-bottom: 0; }
    .help-rule { background: #fff3cd; border-left: 4px solid var(--orange); border-radius: 6px; padding: 10px; margin-top: 12px; font-size: 13px; }
    .help-golden li { padding: 8px 0; border-bottom: 1px solid var(--border); list-style: none; }
    .help-golden li:last-child { border-bottom: 0; }
    @media (max-width: 420px) { .btn-help { min-width: 36px; padding: 5px 6px; } .help-quick-table th, .help-quick-table td { padding: 7px 4px; } }

    /* ── Catalogue Search Widget ── */
    .cat-search { position: relative; margin-top: 8px; }
    .cat-search select, .cat-search input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
    .cat-results {
      position: absolute; z-index: 200; left: 0; right: 0; top: 100%;
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      max-height: 260px; overflow-y: auto; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .cat-results.show { display: block; }
    .cat-ri { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cat-ri:last-child { border-bottom: none; }
    .cat-ri:hover, .cat-ri:focus { background: #eff6ff; }
    .cat-ri-left { flex: 1; min-width: 0; }
    .cat-ri-code { font-weight: 700; color: var(--navy); font-size: 14px; }
    .cat-ri-name { color: var(--text-light); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .cat-ri-price { font-weight: 700; color: #059669; font-size: 14px; white-space: nowrap; }
    .cat-selected-box { background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; padding: 10px 14px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cat-sel-info { font-size: 14px; }
    .cat-sel-code { font-weight: 700; color: var(--navy); }
    .cat-sel-price { font-weight: 700; color: #059669; margin-left: 12px; }
    .cat-sel-clear { color: #ef4444; cursor: pointer; font-size: 12px; font-weight: 600; margin-left: 12px; }
    .cat-loading { padding: 14px; text-align: center; color: var(--text-light); font-size: 13px; }
    .cat-empty { padding: 14px; text-align: center; color: #9ca3af; font-size: 13px; }
    .cat-group-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .cat-group-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: #f9fafb; cursor: pointer; transition: all 0.15s; }
    .cat-group-pill:hover, .cat-group-pill.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ====================== CONSTANTS ======================
const SUPPLIER_TRIM = {
  'Doors Depot': 10, 'Four Seasons': 10, 'Hume Doors': 5, 'Hume': 5,
  'Parkwood Composite': 10, 'Corinthian': 10, 'Not Yet Decided': 10, 'Other': 10
};

const DOOR_TYPES = [
  { id:'ext-door-only',  emoji:'\uD83D\uDEAA',   label:'External Door\n(Door Only)',  wiz:'extDoorOnly'  },
  { id:'ext-door-frame', emoji:'\uD83C\uDFE0',   label:'External Door\n& Frame',      wiz:'extDoorFrame' },
  { id:'int-door-only',  emoji:'\uD83D\uDEAA',   label:'Internal Door\n(Door Only)',  wiz:'intDoorOnly'  },
  { id:'int-door-frame', emoji:'\uD83C\uDFE0',   label:'Internal Door\n& Frame',      wiz:'intDoorFrame' },
  { id:'double-doors',   emoji:'\uD83D\uDEAA\uD83D\uDEAA', label:'Double Doors',     wiz:'doubleDoors'  },

// ====================== HELPERS ======================
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ea(s)  { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function fmtDate() {
  const d=new Date(); const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); return `${dd}/${mm}/${d.getFullYear()}`;
}

function getDTInfo(id) { return DOOR_TYPES.find(d=>d.id===id)||{}; }
function getDTLabel(id) { return (getDTInfo(id).label||id).replace('\n',' '); }
function getWizKey(typeId) { return (getDTInfo(typeId)||{}).wiz; }

function num(v) { const n=parseInt(v); return isNaN(n)?null:n; }

function banner(type, msg) { return `<div class="banner b-${type}">${msg}</div>`; }

function opts(options, field, selected, cols=1) {
  const cls = cols===2 ? 'opts cols2' : 'opts';
  return `<div class="${cls}">` + options.map(o => {
    const val = typeof o==='string' ? o : o.value;
    const lbl = typeof o==='string' ? o : o.label;
    const sel = selected===val;
    return `<button class="opt-btn${sel?' sel':''}" data-field="${ea(field)}" data-val="${ea(val)}"><div class="opt-radio"></div><span>${lbl}</span></button>`;
  }).join('') + '</div>';
}

function yn(field, selected, options=['Yes','No'], classes=['y','n','t']) {
  const n = options.length;
  const gc = n>=3 ? 'c3' : 'c2';
  return `<div class="yn ${gc}">` + options.map((o,i) => {
    const cls = classes[i]||'t';
    const sel = selected===o;
    return `<button class="yn-btn ${cls}${sel?' sel':''}" data-field="${ea(field)}" data-val="${ea(o)}">${o}</button>`;
  }).join('') + '</div>';
}

function numInput(field, val, hint='', ph='') {
  return `<div class="input-unit-wrap"><input type="number" data-field="${ea(field)}" value="${ea(val)}" placeholder="${ph}" inputmode="numeric" pattern="[0-9]*"><span class="unit">mm</span></div>${hint?`<div class="hint">${hint}</div>`:''}`; 
}

function trimFlags(wTrim, hTrim, supplier) {
  const max = SUPPLIER_TRIM[supplier]||10;
  const flags = [];
  if (wTrim!==null) {
    if (wTrim>max) flags.push({t:'danger', m:`\uD83D\uDED1 STOP \u2014 Width trim (${wTrim}mm) exceeds ${supplier||'supplier'} maximum (${max}mm). Manual review required.`});
    else if (wTrim>=0) flags.push({t:'success', m:`\u2705 Width trim: ${wTrim}mm \u2014 within tolerance (max ${max}mm)`});
    else flags.push({t:'warn', m:`\u26A0\uFE0F New door width is ${Math.abs(wTrim)}mm wider than existing \u2014 verify this is correct`});
  }
  if (hTrim!==null) {
    if (hTrim>max) flags.push({t:'danger', m:`\uD83D\uDED1 STOP \u2014 Height trim (${hTrim}mm) exceeds ${supplier||'supplier'} maximum (${max}mm). Manual review required.`});
    else if (hTrim>=0) flags.push({t:'success', m:`\u2705 Height trim: ${hTrim}mm \u2014 within tolerance (max ${max}mm)`});
  }
  return flags;
}

const CAT_API = '/.netlify/functions/catalogue-search';
const PREBUILD_API = '/.netlify/functions/prebuilds-search';
let _catGroups = null;
let _catCache = {};
let _catDebounce = {};

// Load supplier groups from API (cached)
async function catLoadGroups() {
  if (_catGroups) return _catGroups;
  try {
    const r = await fetch(CAT_API + '?listGroups=true');
    const d = await r.json();
    _catGroups = d.groups || [];
  } catch(e) { _catGroups = []; }
  return _catGroups;
}

// Populate group dropdowns once DOM is ready
function catInitDropdowns() {
  catLoadGroups().then(groups => {
    document.querySelectorAll('.cat-group-dd').forEach(sel => {
      const cur = sel.getAttribute('data-cur') || '';
      const filterAttr = sel.getAttribute('data-filter') || '';
      const filters = filterAttr ? filterAttr.split(',').map(s=>s.trim().toLowerCase()) : [];
      let optHtml = '<option value="">— Select supplier —</option>';
      groups.forEach(g => {
        if (filters.length && !filters.includes(g.key)) return;
        const selected = g.key === cur ? ' selected' : '';
        optHtml += '<option value="' + g.key + '"' + selected + '>' + g.label + '</option>';
      });
      sel.innerHTML = optHtml;
    });
  });
}

// Render the catalogue search widget
// wid = unique widget id, d = door data object
// opts: { codeField, nameField, priceField, groupField, defaultGroup, filterGroups, groupLabel, searchLabel, placeholder, hideGroup }
function catWidget(wid, d, opts) {
  opts = opts || {};
  const cf = opts.codeField || (wid+'Code');
  const nf = opts.nameField || (wid+'Name');
  const pf = opts.priceField || (wid+'Price');
  const gf = opts.groupField || (wid+'Group');
  const selCode = d[cf] || '';
  const selName = d[nf] || '';
  const selPrice = d[pf] || '';
  const curGroup = d[gf] || opts.defaultGroup || '';
  const filterAttr = opts.filterGroups ? ' data-filter="' + ea(opts.filterGroups.join(',')) + '"' : '';

  let h = '<div class="cat-search" id="catW_'+wid+'" data-cf="'+cf+'" data-nf="'+nf+'" data-pf="'+pf+'">';

  // Supplier group dropdown
  if (!opts.hideGroup) {
    h += '<div class="form-group"><label>' + (opts.groupLabel||'Supplier') + '</label>';
    h += '<select class="cat-group-dd" data-cur="'+ea(curGroup)+'"'+filterAttr+' onchange="catGroupPick(\''+wid+'\',\''+gf+'\',this.value)">';
    h += '<option value="">Loading suppliers...</option></select></div>';
  }

  // Search input with results dropdown
  const disabled = (!curGroup && !opts.hideGroup) ? ' disabled placeholder="Select a supplier first"' : '';
  h += '<div class="form-group" style="position:relative"><label>' + (opts.searchLabel||'Search') + '</label>';
  h += '<input type="text" id="catI_'+wid+'" class="cat-si" autocomplete="off" ' +
       'placeholder="' + ea(opts.placeholder||'Type part no. or name (min 2 chars)…') + '"' +
       disabled + ' oninput="catTyping(\''+wid+'\',\''+gf+'\',this.value)">';
  h += '<div class="cat-results" id="catR_'+wid+'"></div></div>';

  // Selected item display
  if (selCode) {
    h += '<div class="cat-selected-box"><div class="cat-sel-info">';
    h += '<span class="cat-sel-code">'+esc(selCode)+'</span> — '+esc(selName);
    h += '<span class="cat-sel-price">$'+Number(selPrice||0).toFixed(2)+'</span>';
    h += '</div><span class="cat-sel-clear" onclick="catClear(\''+wid+'\',\''+cf+'\',\''+nf+'\',\''+pf+'\')">✕ Clear</span></div>';
  }

  h += '</div>';
  return h;
}

// Group dropdown changed
function catGroupPick(wid, gf, val) {
  S.currentDoor[gf] = val;
  const inp = document.getElementById('catI_'+wid);
  if (inp) { inp.disabled = !val; inp.value = ''; inp.placeholder = val ? 'Type part no. or name…' : 'Select a supplier first'; }
  const res = document.getElementById('catR_'+wid);
  if (res) { res.innerHTML = ''; res.classList.remove('show'); }
}

// Debounced typing handler
function catTyping(wid, gf, val) {
  clearTimeout(_catDebounce[wid]);
  const res = document.getElementById('catR_'+wid);
  if (val.length < 2) { res.innerHTML=''; res.classList.remove('show'); return; }
  res.innerHTML = '<div class="cat-loading">Searching…</div>';
  res.classList.add('show');
  _catDebounce[wid] = setTimeout(() => catFetch(wid, gf, val), 350);
}

// Fetch results
async function catFetch(wid, gf, q) {
  const group = S.currentDoor[gf] || '';
  const cacheKey = group + '||' + q.toLowerCase();
  const res = document.getElementById('catR_'+wid);

  if (_catCache[cacheKey]) { catShowResults(wid, _catCache[cacheKey], q); return; }

  try {
    let url = CAT_API + '?q=' + encodeURIComponent(q);
    if (group) url += '&group=' + encodeURIComponent(group);
    const r = await fetch(url);
    const data = await r.json();
    _catCache[cacheKey] = data.items || [];
    catShowResults(wid, _catCache[cacheKey], q);
  } catch(e) {
    res.innerHTML = '<div class="cat-empty">Search failed — check connection</div>';
  }
}

// Display results dropdown
function catShowResults(wid, items, q) {
  const res = document.getElementById('catR_'+wid);
  if (!items.length) { res.innerHTML = '<div class="cat-empty">No matches for "'+esc(q)+'"</div>'; res.classList.add('show'); return; }
  let h = '';
  items.slice(0, 50).forEach((it, i) => {
    h += '<div class="cat-ri" onclick="catPick(\''+wid+'\','+i+')" data-idx="'+i+'">';
    h += '<div class="cat-ri-left"><span class="cat-ri-code">'+esc(it.partNo||'—')+'</span>';
    h += '<span class="cat-ri-name">'+esc(it.name||'')+'</span></div>';
    h += '<span class="cat-ri-price">$'+Number(it.tradePriceEx||0).toFixed(2)+'</span>';
    h += '</div>';
  });
  if (items.length > 50) h += '<div class="cat-empty">'+(items.length-50)+' more results — refine your search</div>';
  res.innerHTML = h;
  res.classList.add('show');
  // Store items for pick
  res._items = items;
}

// User picks a result
function catPick(wid, idx) {
  const res = document.getElementById('catR_'+wid);
  const it = res._items[idx];
  if (!it) return;
  const d = S.currentDoor;
  // Read custom field names from data attributes, fallback to wid+suffix
  const container = document.getElementById('catW_'+wid);
  const cf = (container && container.dataset.cf) || (wid+'Code');
  const nf = (container && container.dataset.nf) || (wid+'Name');
  const pf = (container && container.dataset.pf) || (wid+'Price');
  d[cf] = it.partNo || '';
  d[nf] = it.name || '';
  d[pf] = it.tradePriceEx || 0;
  res.classList.remove('show');
  rerenderStep();
  setTimeout(catInitDropdowns, 50);
}

// Clear selected item
function catClear(wid, cf, nf, pf) {
  const d = S.currentDoor;
  d[cf] = ''; d[nf] = ''; d[pf] = '';
  rerenderStep();
  setTimeout(catInitDropdowns, 50);
}

function photoSlot(slotId, label, doorData) {

  h += `<input type="file" accept="image/*" class="photo-input" id="ph_${slotId}" data-slot="${slotId}" style="display:none">`;

// ====================== OUTPUT GENERATION ======================
function getAllFlags(doorData, wizKey) {
  const steps = WIZARDS[wizKey]||[];
  const seen = new Set(); const flags = [];
  steps.forEach(s => {
    (s.flags(doorData)||[]).forEach(f => {
      if (!seen.has(f.m)) { seen.add(f.m); flags.push(f); }
    });
  });
  return flags;
}

function genNotesText(doorData, typeId) {
  const wk = getWizKey(typeId);
  const isExtFrame = wk==='extDoorFrame';
  const isExtOnly  = wk==='extDoorOnly';
  const isIntFrame = wk==='intDoorFrame';
  const isIntOnly  = wk==='intDoorOnly';
  const isBasic = ['doubleDoors','catKitten','wallSlider','barnDoor','bifold'].includes(wk);
  const flags = getAllFlags(doorData, wk);
  const label = getDTLabel(typeId);
  let t = `ON-SITE QUOTE \u2014 ${fmtDate()}\n\n`;
  if (S.job.podiumNotes) t += `Customer enquiry: ${S.job.podiumNotes}\n\n`;
  t += `SCOPE: ${label}, ${doorData.location||'Location TBC'}, ${isExtFrame||isIntFrame?'Door & Frame':'Door Only'}\n`;
  if (isExtOnly||isExtFrame) t += `WEATHER: ${doorData.weatherExposure||'Not specified'}\n`;
  if (isExtOnly) t += `EXISTING DOOR: ${doorData.existingW||'?'} \xD7 ${doorData.existingH||'?'} \xD7 ${doorData.existingT||'?'}mm\n`;
  if (isExtFrame||isIntFrame) {
    const fw=doorData.openingW?num(doorData.openingW)-20:'?'; const fh=doorData.openingH?num(doorData.openingH)-20:'?';
    t += `OPENING: ${doorData.openingW||'?'} \xD7 ${doorData.openingH||'?'}mm\nFRAME SIZE: ${fw} \xD7 ${fh}mm\n`;
  }
  if (isExtOnly||isIntOnly) {
    const wt=doorData.existingW&&doorData.newW?num(doorData.existingW)-num(doorData.newW):'?';
    const ht=doorData.existingH&&doorData.newH?num(doorData.existingH)-num(doorData.newH):'?';
    t += `NEW DOOR: ${doorData.newW||'?'} \xD7 ${doorData.newH||'?'}mm \u2014 Trim: W=${wt}mm H=${ht}mm\n`;
  }
  if (isExtFrame||isIntFrame) {
    if (doorData.newW&&doorData.newH) t += `DOOR SIZE: ${doorData.newW} \xD7 ${doorData.newH}mm${doorData.doorStyle?' \u2014 '+doorData.doorStyle:''}\n`;
  }
  if (isIntOnly||isIntFrame) {
    if (doorData.floorFinish) t += `FLOOR: ${doorData.floorFinish}${doorData.bottomGap?`, gap: ${doorData.bottomGap}mm`:''}\n`;
  }
  if (doorData.seal) t += `SEAL: ${doorData.seal}\n`;
  if (doorData.supplier) t += `SUPPLIER: ${doorData.supplier}${doorData.doorStyle&&!isExtFrame&&!isIntFrame?' \u2014 '+doorData.doorStyle:''}\n`;
  if (doorData.hwOption) {
    if (doorData.hwOption==='New hardware required') {
      t += `HARDWARE: ${doorData.hwSupplier||'Supplier TBC'} \u2014 ${doorData.hwModel||'Model TBC'}${doorData.hwType?' ('+doorData.hwType+')':''}${doorData.keyAlike==='Yes'?', Key alike':''}\n`;
      if (doorData.hingeType) t += `HINGES: ${doorData.hingeQty||'3'} \xD7 ${doorData.hingeSpec||'size TBC'} \u2014 ${doorData.hingeType}\n`;
      if (doorData.extraHardware && doorData.extraHardware.length > 0) {
        const validHW = doorData.extraHardware.filter(it => it.supplier||it.model);
        if (validHW.length > 0) {
          t += `ADDITIONAL HARDWARE:\n`;
          validHW.forEach(it => { t += `  \u2014 ${it.supplier||'Supplier TBC'} ${it.model||'Model TBC'} \xD7${it.qty||1}\n`; });
        }
      }
      if (doorData.doorProductCode) t += `DOOR CODE: ${doorData.doorProductCode}\n`;
    } else {
      t += `HARDWARE: Reuse existing\n`;
    }
  }
  if (doorData.hasScreen) t += `SCREEN DOOR: ${doorData.hasScreen}${doorData.stopWidth?', Stop: '+doorData.stopWidth+'mm':''}${doorData.stopFixed?', Fixed: '+doorData.stopFixed:''}\n`;
  if (isExtOnly||isExtFrame) {
    if (doorData.weatherstop) t += `WEATHER STOP UPGRADE: ${doorData.weatherstop}\n`;
  }
  if (isExtFrame) {
    t += `INFILLS: 67\xD718 DAR beading \u2014 ${doorData.infillConfirmed||'confirm'}\n`;
    t += `SEAL KIT: ${doorData.sealKit||'confirm'}\nSILICONE: ${doorData.silicone||'confirm'}\n`;
  }
  if (isBasic && doorData.reqsChecked && doorData.reqsChecked.length>0) {
    t += `\nCHECKLIST ITEMS CONFIRMED:\n${doorData.reqsChecked.map(r=>'\u2713 '+r).join('\n')}\n`;
  }
  if (doorData.additionalNotes) t += `\nSITE OBSERVATIONS:\n${doorData.additionalNotes}\n`;
  const photoCount = Object.keys(doorData.photosTaken||{}).length;
  if (photoCount>0) t += `\nPHOTOS: ${photoCount} photo(s) captured on site\n`;
  if (flags.length>0) t += `\nFLAGS / INFO REQUIRED:\n${flags.map(f=>f.m).join('\n')}\n`;
  t += `\nSTATUS: Draft \u2013 GM Review Required`;
  return t;
}

function genSimproItems(doorData, typeId) {
  const wk = getWizKey(typeId);
  const isExtFrame = wk==='extDoorFrame';
  const isIntFrame = wk==='intDoorFrame';
  const label = getDTLabel(typeId);
  const items = [];
  items.push(`\u25A1 [Prebuild: ${label}${doorData.newW?' \u2014 '+doorData.newW+'\xD7'+(doorData.newH||'?')+'mm':''}${doorData.doorStyle?' '+doorData.doorStyle:''}]`);
  items.push(`\u25A1 [Labour: ${isExtFrame||isIntFrame?'Door & Frame Install':'Door Only Install'}]`);
  if (doorData.seal&&doorData.seal!=='No Seal') items.push(`\u25A1 [Seal: ${doorData.seal}]`);
  if (doorData.hwOption==='New hardware required') items.push(`\u25A1 [Hardware: ${doorData.hwSupplier||'Supplier TBC'} \u2014 ${doorData.hwModel||'model TBC'}${doorData.keyAlike===('Yes')?', key alike':''}]`);
  if (doorData.hingeType) items.push(`\u25A1 [Hinges: ${doorData.hingeQty||'3'} \xD7 ${doorData.hingeSpec||'TBC'} \u2014 ${doorData.hingeType}]`);
  if (doorData.extraHardware) {
    doorData.extraHardware.filter(it=>it.supplier||it.model).forEach(it => {
      items.push(`\u25A1 [Additional HW: ${it.supplier||'TBC'} \u2014 ${it.model||'TBC'} \xD7${it.qty||1}]`);
    });
  }
  if (doorData.doorProductCode) items.push(`\u25A1 [Door Code: ${doorData.doorProductCode}]`);
  if (isExtFrame) { items.push('\u25A1 [Infills: 67\xD718 DAR beading \u2014 REQUIRED]'); items.push('\u25A1 [Seal kit \u2014 REQUIRED]'); items.push('\u25A1 [Silicone \u2014 REQUIRED]'); }
  if (doorData.revealType==='Existing architraves'||doorData.doorStops==='Yes \u2014 include in quote') items.push(`\u25A1 [Architraves: ${doorData.newArchSize||'size TBC'}]`);
  if (doorData.weatherstop==='Yes \u2014 include in quote') items.push('\u25A1 [Weather Guard stop upgrade]');
  if (doorData.hasScreen==='Yes'&&(num(doorData.stopWidth)<70||doorData.stopFixed==='Yes')) items.push('\u25A1 [Screen door refit \u2014 FLAG: clearance check required]');
  if (doorData.doorStops==='Yes \u2014 include in quote') items.push('\u25A1 [Door stops]');
  return items;
}

function genSizingLines(doorData, typeId) {
  const wk = getWizKey(typeId);
  const isExtFrame = wk==='extDoorFrame'; const isIntFrame = wk==='intDoorFrame';
  const isExtOnly = wk==='extDoorOnly';   const isIntOnly = wk==='intDoorOnly';
  const isBasic = ['doubleDoors','catKitten','wallSlider','barnDoor','bifold'].includes(wk);
  if (isExtFrame||isIntFrame) {
    const fw=doorData.openingW?num(doorData.openingW)-20:'?'; const fh=doorData.openingH?num(doorData.openingH)-20:'?';
    let s = `Opening: ${doorData.openingW||'?'} \xD7 ${doorData.openingH||'?'}mm\nFrame:   ${fw} \xD7 ${fh}mm`;
    if (doorData.newW&&doorData.newH) s += `\nDoor:    ${doorData.newW} \xD7 ${doorData.newH}mm`;
    return s;
  } else if (isExtOnly) {
    const wt=doorData.existingW&&doorData.newW?num(doorData.existingW)-num(doorData.newW):'?';
    const ht=doorData.existingH&&doorData.newH?num(doorData.existingH)-num(doorData.newH):'?';
    const max=SUPPLIER_TRIM[doorData.supplier]||10;
    const ok = typeof wt==='number'&&typeof ht==='number'&&wt<=max&&ht<=max;
    return `Existing: ${doorData.existingW||'?'} \xD7 ${doorData.existingH||'?'}mm\nNew Door: ${doorData.newW||'?'} \xD7 ${doorData.newH||'?'}mm\nTrim: W=${wt}mm H=${ht}mm \u2014 ${ok?'\u2705 Within tolerance':'\uD83D\uDED1 CHECK REQUIRED'}`;
  } else if (isIntOnly) {
    const wt=doorData.existingW&&doorData.newW?num(doorData.existingW)-num(doorData.newW):'?';
    const ht=doorData.existingH&&doorData.newH?num(doorData.existingH)-num(doorData.newH):'?';
    return `Existing: ${doorData.existingW||'?'} \xD7 ${doorData.existingH||'?'}mm\nNew Door: ${doorData.newW||'?'} \xD7 ${doorData.newH||'?'}mm\nTrim: W=${wt}mm H=${ht}mm`;
  } else if (isBasic) {
    return `Opening: ${doorData.openingW||'?'} \xD7 ${doorData.openingH||'?'}mm`;
  }
  return '';
}

function genFullOutput() {
  const {job, completedDoors} = S;
  let o = `\u2554${'═'.repeat(36)}\u2557\n\u2551   2ND FIX \u2014 QUOTE SUMMARY          \u2551\n\u255A${'═'.repeat(36)}\u255D\n`;
  o += `\nJOB: ${job.jobNumber||'TBC'} \u2014 ${job.customerName||'No Name'}\nADDRESS: ${job.address||'Not provided'}\nDATE: ${fmtDate()}\nDOORS: ${completedDoors.length}\n`;
  completedDoors.forEach((door,i) => {
    const flags = getAllFlags(door.data, getWizKey(door.typeId));
    const items = genSimproItems(door.data, door.typeId);
    const sizing = genSizingLines(door.data, door.typeId);
    const notes = genNotesText(door.data, door.typeId);
    const label = getDTLabel(door.typeId);
    o += `\n${'═'.repeat(40)}\nDOOR ${i+1}: ${label}\n${'═'.repeat(40)}\n`;
    if (sizing) o += `\n\uD83D\uDCCF SIZING\n${sizing}\n`;
    if (flags.length>0) o += `\n\u26A0\uFE0F FLAGS\n${flags.map(f=>f.m).join('\n')}\n`;
    o += `\n\uD83C\uDFD7\uFE0F SIMPRO \u2014 ITEMS TO ADD\nCost Centre: ${label} \u2014 ${door.data.location||'Location TBC'}\n${items.join('\n')}\n`;
    o += `\n\uD83D\uDCDD SIMPRO NOTES\n${'\u2500'.repeat(40)}\n${notes}\n${'\u2500'.repeat(40)}\n`;
  });
  return o;
}

const CREATE_QUOTE_API = '/.netlify/functions/create-quote';
let _simproInFlight = false;

// Last word = family name. Single word = family name only.
function splitCustomerName(name) {
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if (parts.length===0) return { givenName:'', familyName:'' };
  if (parts.length===1) return { givenName:'', familyName:parts[0] };
  return { givenName: parts.slice(0,-1).join(' '), familyName: parts[parts.length-1] };
}

// Best-effort split of the single address field into Simpro address parts
function parseAddress(raw) {
  let address = String(raw||'').trim();
  let city = '', state = 'SA', postalCode = '';
  const pc = address.match(/(\d{4})\s*$/);
  if (pc) { postalCode = pc[1]; address = address.slice(0, pc.index).replace(/[,\s]+$/,'').trim(); }
  const st = address.match(/[,\s]+(SA|NSW|VIC|QLD|WA|NT|TAS|ACT)\s*$/i);
  if (st) { state = st[1].toUpperCase(); address = address.slice(0, st.index).replace(/[,\s]+$/,'').trim(); }
  const parts = address.split(',').map(p=>p.trim()).filter(Boolean);
  if (parts.length>1) { city = parts.pop(); address = parts.join(', '); }
  return { address, city, state, postalCode };
}

// 21 Door S&I always; 24 Hardware S&I if new/extra hardware; 28 Screen Door if a screen is involved
function doorCostCentres(d) {
  const cc = [21];
  const extras = (d.extraHardware||[]).filter(it => it && (it.supplier||it.model));
  if (d.hwOption==='New hardware required' || extras.length>0) cc.push(24);
  if (d.hasScreen==='Yes') cc.push(28);
  return cc;
}

function buildSimproDoors() {
  return S.completedDoors.map((door,i) => {
    const label = getDTLabel(door.typeId);
    const sizing = genSizingLines(door.data, door.typeId);
    const flags = getAllFlags(door.data, getWizKey(door.typeId));
    const items = genSimproItems(door.data, door.typeId);
    let desc = '';
    if (sizing) desc += sizing + '\n';
    if (flags.length>0) desc += `\nFLAGS:\n${flags.map(f=>f.m).join('\n')}\n`;
    desc += `\nITEMS TO ADD:\n${items.join('\n')}`;
    return {
      sectionName: `Door ${i+1}: ${label} \u2014 ${door.data.location||'Location TBC'}`,
      description: desc.trim(),
      costCentres: doorCostCentres(door.data)
    };
  });
}

function simproMsg(html) {
  const el = document.getElementById('simproMsg');
  if (el) el.innerHTML = html;
}

function simproLogHtml(log) {
  if (!Array.isArray(log)||log.length===0) return '';
  return `<div class="sm mt8" style="font-family:monospace;font-size:11.5px;line-height:1.6">${log.map(l=>esc(l)).join('<br>')}</div>`;
}

async function createSimproQuote() {
  if (_simproInFlight) return;
  const btn = document.getElementById('simproBtn');
  if (!btn) return;
  const {job, completedDoors} = S;
  const customerName = (job.customerName||'').trim();
  const addressRaw = (job.address||'').trim();

  if (!customerName || !addressRaw) {
    simproMsg(banner('danger','\u26A0\uFE0F Add the customer name and site address in Job Details before creating a Simpro quote.'));
    return;
  }
  if (completedDoors.length===0) {
    simproMsg(banner('danger','\u26A0\uFE0F Capture at least one door before creating a Simpro quote.'));
    return;
  }
  if (location.hostname.includes('github.io')) {
    simproMsg(banner('warn','\u26A0\uFE0F Simpro quoting only works on the Netlify app. Open 2ndfix-quote-wizard.netlify.app'));
    return;
  }

  const nm = splitCustomerName(customerName);
  const addr = parseAddress(addressRaw);
  const doors = buildSimproDoors();
  const salespersonName = (loggedInUser && loggedInUser.name) || 'George Kalliontzis';

  if (!confirm(`Create a DRAFT quote in Simpro?\n\nCustomer: ${customerName}\nAddress: ${addressRaw}\nDoors: ${doors.length}\nSalesperson: ${salespersonName}\n\nNothing is sent to the customer.`)) return;

  _simproInFlight = true;
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '0.7';
  btn.innerHTML = '\u23F3 Creating draft quote in Simpro\u2026';
  simproMsg('');

  const payload = {
    customer: {
      givenName: nm.givenName, familyName: nm.familyName,
      mobile: (job.mobile||'').trim(), email: (job.email||'').trim(),
      address: addr.address, city: addr.city, state: addr.state, postalCode: addr.postalCode
    },
    salespersonName,
    jobNumber: job.jobNumber||'',
    fullOutput: genFullOutput(),
    doors
  };

  let data = null, netErr = null;
  try {
    const res = await fetch(CREATE_QUOTE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.status===404) netErr = 'functions-missing';
    else data = await res.json().catch(()=>null);
    if (!netErr && !data) netErr = 'bad-response';
  } catch(e) {
    netErr = 'network';
  }

  _simproInFlight = false;
  btn.disabled = false;
  btn.style.opacity = '';
  btn.innerHTML = originalLabel;

  if (netErr==='functions-missing') {
    simproMsg(banner('warn','\u26A0\uFE0F Simpro quoting only works on the Netlify app. Open 2ndfix-quote-wizard.netlify.app'));
    return;
  }
  if (netErr) {
    simproMsg(banner('danger','\u274C Could not reach Simpro. Check your internet connection and try again.'));
    return;
  }

  if (data.success && data.quoteId) {
    const created = data.created || {};
    const custTxt = created.customer ? 'New customer created' : 'Existing customer used';
    const siteTxt = created.site ? 'new site created' : 'existing site used';
    btn.style.display = 'none';
    const hint = document.getElementById('simproHint');
    if (hint) hint.style.display = 'none';
    simproMsg(`<div class="banner b-success" style="text-align:left">
      <div class="fw7 mb8">\u2705 Draft Quote #${esc(String(data.quoteId))} created in Simpro</div>
      <div class="sm mb8">${esc(custTxt)} \u2014 ${esc(siteTxt)}.</div>
      <a class="btn btn-success btn-sm" href="${ea(data.quoteUrl||'')}" target="_blank" rel="noopener">\uD83D\uDD17 Open Quote in Simpro</a>
      <div class="sm mt8">Next: add pricing to each cost centre, then review before sending.</div>
    </div>`);
  } else {
    simproMsg(`<div class="banner b-danger" style="text-align:left">
      <div class="fw7 mb8">\u274C Draft quote not created</div>
      <div class="sm">${esc(data.error||'Unknown error from Simpro.')}</div>
      ${simproLogHtml(data.log)}
      <div class="sm mt8">Fix the issue above and tap the button again.</div>
    </div>`);
  }
}

// ====================== EVENT LISTENERS ======================
function attachListeners() {
  const app = document.getElementById('app');

  // Login form
  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    });
  }

  // Help accordions
  app.querySelectorAll('[data-help-accordion]').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = document.getElementById(btn.dataset.helpAccordion);
      if (!section) return;
      const open = section.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });

  // Job fields
  app.querySelectorAll('[data-job]').forEach(el => {
    el.addEventListener('input', e => { S.job[e.target.dataset.job] = e.target.value; saveSt(); });
  });

  // Door type buttons
  app.querySelectorAll('[data-doortype]').forEach(btn => {
    btn.addEventListener('click', () => {
      S.currentTypeId = btn.dataset.doortype;
      S.currentStep = 0;
      S.currentDoor = {};
      S.stepError = null;
      S.screen = 'wizard';
      render();
    });
  });

  // Job scope area chips
  app.querySelectorAll('[data-area]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!S.job.areas) S.job.areas = {};
      const area = btn.dataset.area;
      if (S.job.areas[area]) { delete S.job.areas[area]; }
      else { S.job.areas[area] = 1; }
      saveSt();
      render();
    });
  });

  // Job scope area quantity steppers
  app.querySelectorAll('[data-areaqty]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!S.job.areas) S.job.areas = {};
      const area = btn.dataset.areaqty;
      const delta = parseInt(btn.dataset.delta, 10) || 0;
      const next = (S.job.areas[area] || 0) + delta;
      if (next < 1) { delete S.job.areas[area]; }
      else { S.job.areas[area] = next; }
      saveSt();
      render();
    });
  });

  // Option buttons
  app.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const field = btn.dataset.field;
      const val = btn.dataset.val;
      if (field && field.startsWith('extraHw_')) {
        const parts = field.split('_');
        const idx = parseInt(parts[1]);
        const key = parts[2];
        if (!S.currentDoor.extraHardware) S.currentDoor.extraHardware = [];
        if (!S.currentDoor.extraHardware[idx]) S.currentDoor.extraHardware[idx] = {supplier:'',model:'',qty:'1'};
        S.currentDoor.extraHardware[idx][key] = val;
      } else {
        S.currentDoor[field] = val;
      }
      S.stepError = null;
      rerenderStep();
    });
  });

  // Yes/No buttons
  app.querySelectorAll('.yn-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      S.currentDoor[btn.dataset.field] = btn.dataset.val;
      S.stepError = null;
      rerenderStep();
    });
  });

  // Text/number inputs in wizard
  app.querySelectorAll('[data-field]').forEach(el => {
    if (el.tagName==='INPUT'||el.tagName==='TEXTAREA') {
      el.addEventListener('input', e => {
        const field = e.target.dataset.field;
        if (field && field.startsWith('extraHw_')) {
          const parts = field.split('_');
          const idx = parseInt(parts[1]);
          const key = parts[2];
          if (!S.currentDoor.extraHardware) S.currentDoor.extraHardware = [];
          if (!S.currentDoor.extraHardware[idx]) S.currentDoor.extraHardware[idx] = {supplier:'',model:'',qty:'1'};
          S.currentDoor.extraHardware[idx][key] = e.target.value;
        } else {
          S.currentDoor[field] = e.target.value;
        }
        saveSt();
        if (e.target.type==='number') {
          scheduleRerender(field, e.target.selectionStart);
        }
      });
    }
  });

  // Photo inputs
  app.querySelectorAll('.photo-input').forEach(input => {
    input.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const slotId = e.target.dataset.slot;
      if (PHOTOS[slotId]) URL.revokeObjectURL(PHOTOS[slotId].url);
      PHOTOS[slotId] = { url: URL.createObjectURL(file), name: file.name };
      if (!S.currentDoor.photosTaken) S.currentDoor.photosTaken = {};
      S.currentDoor.photosTaken[slotId] = file.name;
      saveSt();
      rerenderStep();
    });
  });

  // Size picker now uses plain text inputs - no button handler needed

  // Requirements checkboxes
  app.querySelectorAll('.rc').forEach(cb => {
    cb.addEventListener('change', e => {
      const r = e.target.dataset.req;
      if (!S.currentDoor.reqsChecked) S.currentDoor.reqsChecked = [];
      if (e.target.checked) { if (!S.currentDoor.reqsChecked.includes(r)) S.currentDoor.reqsChecked.push(r); }
      else S.currentDoor.reqsChecked = S.currentDoor.reqsChecked.filter(x=>x!==r);
      saveSt();
    });
  });

  // Actions
  app.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => handleAction(el.dataset.action));
  });
}

function rerenderStep() {
  const wk = getWizKey(S.currentTypeId);
  const steps = WIZARDS[wk]||[];
  const step = steps[S.currentStep];
  if (!step) return;
  const card = document.querySelector('.card');
  if (!card) return;
  const hdrEl = card.querySelector('.step-hdr');
  const hdrHtml = hdrEl ? hdrEl.outerHTML : '';
  card.innerHTML = hdrHtml + step.render(S.currentDoor) + (S.stepError?banner('danger','\u26A0\uFE0F '+S.stepError):'');
  attachListeners();
  saveSt();
  setTimeout(catInitDropdowns, 30);
}

function handleAction(action) {
  if (action==='logout') {
    logout();
  } else if (action==='help') {
    S.prevScreen = S.screen || 'home';
    S.screen = 'help';
    render();
  } else if (action==='help-back') {
    S.screen = S.prevScreen || 'home';
    S.prevScreen = null;
    render();
  } else if (action==='back') {
    if (S.currentStep>0) { S.currentStep--; S.stepError=null; render(); }
    else { S.screen='home'; S.currentDoor={}; S.stepError=null; render(); }
  } else if (action==='next') {
    const wk = getWizKey(S.currentTypeId);
    const steps = WIZARDS[wk]||[];
    const step = steps[S.currentStep];
    const err = step.validate(S.currentDoor);
    if (err) { S.stepError=err; rerenderStep(); return; }
    S.stepError = null;
    if (S.currentStep===steps.length-1) {
      S.completedDoors.push({typeId:S.currentTypeId, data:{...S.currentDoor}});
      S.screen='summary'; S.currentDoor={}; render();
    } else { S.currentStep++; render(); }
  } else if (action==='back-home') {
    S.screen='home'; render();
  } else if (action==='view-summary') {
    S.screen='summary'; render();
  } else if (action==='add-another') {
    S.screen='home'; S.currentDoor={}; S.currentStep=0; S.currentTypeId=null; render();
  } else if (action==='new-job') {
    if (confirm('Start a new job? This will clear all current data.')) {
      clearSt(); S=defaultState(); render();
    }
  } else if (action==='add-hw') {
    if (!S.currentDoor.extraHardware) S.currentDoor.extraHardware = [];
    S.currentDoor.extraHardware.push({supplier:'',model:'',qty:'1'});
    saveSt();
    rerenderStep();
  } else if (action.startsWith('remove-hw-')) {
    const idx = parseInt(action.replace('remove-hw-',''));
    if (S.currentDoor.extraHardware) {
      S.currentDoor.extraHardware.splice(idx, 1);
      saveSt();
      rerenderStep();
    }
  } else if (action==='create-simpro-quote') {
    createSimproQuote();
  } else if (action==='copy-notes') {
    const t = document.getElementById('_notesOut')?.value||'';
    doCopy(t, 'Notes copied to clipboard!');
  } else if (action==='copy-full') {
    const t = document.getElementById('_fullOut')?.value||'';
    doCopy(t, 'Full summary copied to clipboard!');
  }
}

function doCopy(text, msg) {
  const fb = document.getElementById('cpFb');
  const set = (m,ok) => { if(fb){fb.textContent=m; fb.style.color=ok?'var(--success)':'var(--danger)'; setTimeout(()=>{fb.textContent='';},3000);} };
  if (navigator.clipboard&&navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>set('\u2705 '+msg,true)).catch(()=>fallbackCopy(text,msg,set));
  } else fallbackCopy(text,msg,set);
}

function fallbackCopy(text,msg,set) {
  try {
    const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;left:-9999px;top:-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); set('\u2705 '+msg,true);
  } catch(e) { set('\u274C Copy failed \u2014 select text manually',false); }
}

    const dateStr = new Date().toLocaleDateString('en-AU');
    const who = (loggedInUser && loggedInUser.name) || 'Unknown user';
    const payload = {
      type: 'improvement_suggestion',

      context: { screen: S.screen || 'unknown', step: (S.currentStep >= 0 ? S.currentStep : null) }

    try {

      log.push(payload);

    } catch(e) {}
    function emailFallback() {
      const subject = encodeURIComponent('Quote Wizard Suggestion \u2014 ' + who);
      const body = encodeURIComponent('Suggestion:\n' + fb + '\n\n---\nFrom: ' + who + '\nDate: ' + dateStr + '\nScreen: ' + (S.screen || 'unknown') + '\nSource: 2nd Fix Quote Wizard v3');
      window.location.href = 'mailto:george@2ndfix.com.au?subject=' + subject + '&body=' + body;
    }
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000));

    });

// --- Signature pad logic ---
function initSigPad(context) {
  const canvas = document.getElementById('sigCanvas_' + context);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const sigKey = 'trimWarrantySig_' + context;

  // Set canvas pixel size to match display size
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width || 300;
  canvas.height = 160;

  // If existing sig data, restore it
  const existing = S.currentDoor[sigKey];
  if (existing) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = existing;
    canvas.classList.add('signed');
  }

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let drawing = false;
  let lastX = 0, lastY = 0;

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }

  function start(e) { e.preventDefault(); drawing = true; [lastX, lastY] = getPos(e); }
  function move(e) {
    e.preventDefault();
    if (!drawing) return;
    const [x, y] = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    [lastX, lastY] = [x, y];
    // Save on each stroke
    S.currentDoor[sigKey] = canvas.toDataURL();
    canvas.classList.add('signed');
    const st = document.getElementById('sigStatus_' + context);
    if (st) st.textContent = '✅ Signature captured';
  }
  function end(e) { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function clearSig(context) {
  const canvas = document.getElementById('sigCanvas_' + context);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const sigKey = 'trimWarrantySig_' + context;
  delete S.currentDoor[sigKey];
  canvas.classList.remove('signed');
  const st = document.getElementById('sigStatus_' + context);
  if (st) st.textContent = 'Ask customer to sign above with their finger';
}

// Hook into rerenderStep to init sig pads after render
const _origRender = rerenderStep;
rerenderStep = function() {
  _origRender();
  // Init any sig pads present in the DOM
  document.querySelectorAll('[id^="sigCanvas_"]').forEach(el => {
    const ctx = el.id.replace('sigCanvas_', '');
    initSigPad(ctx);
  });
};
